server:
  port: 8080

spring:

  main:
    allow-bean-definition-overriding: true

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  datasource:
    url: jdbc:postgresql://localhost:5432/blueprintsdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: never

  profiles:
    active: undersampling
    # active: redundancy

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always

blueprints:
  security:
    issuer: "https://decsis-eci/blueprints"
    token-ttl-seconds: 10